[build]
  base = "/site/gatsby-site"
  publish = "public"

[[plugins]]
  package = "@netlify/plugin-gatsby"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/lookupindex.json"
  [headers.values]
    access-control-allow-origin = "*"

[[headers]]
  for = "/embed.js"
  [headers.values]
    access-control-allow-origin = "*"

[[redirects]]
  from = "/api/graphql"
  to = "/.netlify/functions/graphql"
  status = 200
  [redirects.rate_limit]
    # 1000 requests per 180 seconds, per unique IP + domain. Every request now
    # needs an account and is counted per account (SEE: server/apiUsage.ts), so
    # this is a coarse abuse ceiling; the previous 100 was low enough that one
    # busy admin page could lock an office's shared IP out for three minutes.
    window_limit = 1000
    window_size = 180
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/parseNews"
  to = "/.netlify/functions/parseNews"
  status = 200

[[redirects]]
  from = "/api/semanticallyRelated"
  to = "/.netlify/functions/semanticallyRelated"
  status = 200

[[redirects]]
  from = "/api/lookupbyurl"
  to = "/.netlify/functions/lookupbyurl"
  status = 200

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
