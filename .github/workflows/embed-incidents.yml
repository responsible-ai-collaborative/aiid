name: Embed Incidents

on:
  # 08:37 UTC daily = 12:37 AM US Pacific Standard Time (1:37 AM during daylight time).
  # Off the hour: GitHub can delay or drop scheduled runs at the busy start of each hour.
  # GitHub Actions cron is UTC-only and does not adjust for DST.
  # Scheduled runs always skip unchanged incidents, so they only embed new or changed ones.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: The Github environment to load secrets from
        type: environment
        required: true
      limit:
        description: Process at most this many incidents (0 = all)
        type: number
        default: 0
        required: false
      skip_unchanged:
        description: Skip incidents whose source and embedding configuration are unchanged
        type: boolean
        default: false
        required: false

defaults:
  run:
    shell: bash

# A long manual run and the nightly run would otherwise embed the same incidents twice.
concurrency:
  group: embed-incidents-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  embed-incidents:
    # A scheduled run has no inputs, so it targets production.
    environment: ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    # Generous because a rate-limited endpoint can stretch a full run over several hours.
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install NPM dependencies
        run: npm ci
        working-directory: site/gatsby-site

      - name: Embed incidents
        run: |
          args=()
          if (( RUN_LIMIT > 0 )); then
            args+=(--limit "$RUN_LIMIT")
          fi
          if [[ "$RUN_SKIP_UNCHANGED" == "true" ]]; then
            args+=(--skip-unchanged)
          fi
          npm run embed-incidents:ci -- "${args[@]}"
        working-directory: site/gatsby-site
        # The two credentials are secrets only. Everything below reads from a variable
        # first and a secret second, so either place works, and a value set as a secret
        # is masked in the log. Unset on both falls back to the code default.
        env:
          MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_BASE_URL: ${{ vars.EMBEDDING_API_BASE_URL || secrets.EMBEDDING_API_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || secrets.EMBEDDING_MODEL }}
          EMBEDDING_CONCURRENCY: ${{ vars.EMBEDDING_CONCURRENCY || secrets.EMBEDDING_CONCURRENCY }}
          EMBEDDING_TIMEOUT_MS: ${{ vars.EMBEDDING_TIMEOUT_MS || secrets.EMBEDDING_TIMEOUT_MS }}
          EMBEDDING_MAX_ATTEMPTS: ${{ vars.EMBEDDING_MAX_ATTEMPTS || secrets.EMBEDDING_MAX_ATTEMPTS }}
          EMBEDDING_MAX_INPUT_CHARS: ${{ vars.EMBEDDING_MAX_INPUT_CHARS || secrets.EMBEDDING_MAX_INPUT_CHARS }}
          EMBEDDING_CHUNK_OVERLAP_CHARS: ${{ vars.EMBEDDING_CHUNK_OVERLAP_CHARS || secrets.EMBEDDING_CHUNK_OVERLAP_CHARS }}
          EMBEDDING_BATCH_SIZE: ${{ vars.EMBEDDING_BATCH_SIZE || secrets.EMBEDDING_BATCH_SIZE }}
          RUN_LIMIT: ${{ inputs.limit }}
          RUN_SKIP_UNCHANGED: ${{ github.event_name == 'schedule' || inputs.skip_unchanged }}

      # Uploaded even on failure, because that is when the manifest is worth reading.
      - name: Upload failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embed-failures
          path: site/gatsby-site/embed-failures.json
          if-no-files-found: ignore
